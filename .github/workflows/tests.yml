name: Python analytical procedures tests
on:
  push:
    paths:
      - "main.py"
      - "overall.py"
      - "dart.py"
      - "ai.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --company "가상기업" --year 2025 --demo --output /tmp/demo.xlsx
